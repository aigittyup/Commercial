[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "andon"
version = "0.1.0"
description = "Andon - Real-time alert and escalation system for new product commercialization"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
andon = "andon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["andon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
