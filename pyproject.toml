[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anton"
version = "0.1.0"
description = "Anton - Commercialization Process Management System for New Product Introductions"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
anton = "anton.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["anton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
